<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de Impresión - Magnet by Luna</title>
  <style>
    @media print {
      body { margin: 0; padding: 0; background: none; }
      .no-print { display: none; }
      .print-page { page-break-after: always; margin: 0; box-shadow: none !important; }
    }
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    .no-print { max-width: 800px; margin: 0 auto 20px auto; background: white; padding: 20px; border-radius: 8px; }
    .btn-print { background: #4a6fa5; color: white; border: none; padding: 12px 20px; font-size: 1rem; font-weight: bold; border-radius: 6px; cursor: pointer; }
    
    /* Hoja de impresión tamaño Carta (8.5 x 11 pulgadas) */
    .print-page {
      width: 8.5in;
      height: 11in;
      background: white;
      margin: 0 auto;
      padding: 0.5in;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    
    /* Cuadrícula 3x3 con márgenes de separación para la guillotina */
    .print-grid {
      display: grid;
      grid-template-columns: repeat(3, 2in);
      grid-template-rows: repeat(3, 2in);
      gap: 0.35in; /* Espacio de seguridad para cortar limpiamente */
    }
    
    .print-item {
      width: 2in;
      height: 2in;
      border: 1px dashed #ccc; /* Guía tenue de corte */
      box-sizing: border-box;
      overflow: hidden;
    }
    
    .print-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <div class="no-print">
    <h2>Vista Previa de Impresión (Hoja Carta)</h2>
    <p>Haz clic en el botón para enviar directamente a tu impresora Canon PIXMA G6020:</p>
    <button class="btn-print" onclick="window.print()">🖨️ Imprimir Hoja de Imanes</button>
  </div>

  <!-- Hoja Imprimible -->
  <div class="print-page">
    <div class="print-grid" id="printGrid">
      <!-- Se cargarán las 9 fotos aquí -->
    </div>
  </div>

  <script>
    // Recupera las imágenes cargadas temporalmente
    const images = JSON.parse(sessionStorage.getItem('currentOrderPhotos') || '[]');
    const grid = document.getElementById('printGrid');

    for (let i = 0; i < 9; i++) {
      const box = document.createElement('div');
      box.className = 'print-item';
      if (images[i]) {
        const img = document.createElement('img');
        img.src = images[i];
        box.appendChild(img);
      }
      grid.appendChild(box);
    }
  </script>

</body>
</html>
